<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <script>
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('smartrecipe-theme') || 'light';
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'pumpkin' && theme !== 'lavender' && theme !== 'light') {
          theme = 'light';
        }
        var scheme = theme === 'dark' ? 'only dark' : 'only light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = scheme;
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', scheme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant:ital,wght@0,500;0,600;1,400;1,500&display=swap"

    />
